<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f0927">
  <meta name="description" content="Sebuah kejutan kecil untuk merayakan hari spesialmu.">
  <title>Happy Birthday, Cantikk!</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #7d1236 0%, #4f0927 40%, #220711 100%);
      color: #fff6f9;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .card {
      text-align: center;
      padding: 42px 28px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(8px);
      max-width: 700px;
      width: calc(100% - 32px);
    }

    h1 {
      font-size: clamp(2.2rem, 5vw, 4rem);
      margin: 0 0 12px;
      letter-spacing: 1px;
    }

    p {
      font-size: clamp(1rem, 2vw, 1.3rem);
      margin: 0;
      opacity: 0.92;
    }

    .sparkles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.75) 0 2px, transparent 2px),
        radial-gradient(circle, rgba(255,220,130,0.9) 0 1.5px, transparent 1.5px),
        radial-gradient(circle, rgba(255,170,200,0.8) 0 1.8px, transparent 1.8px);
      background-size: 140px 140px;
      background-position: 0 0, 30px 50px, 60px 90px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="sparkles"></div>

  <div class="card">
    <h1>Happy Birthday, Cantikk!</h1>
    <p>Semoga hari ini penuh kebahagiaan, senyum, dan momen indah yang selalu kamu ingat.</p>
  </div>

  <audio id="bgm" autoplay loop playsinline>
    <source src="lagu_browser.mp3" type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById('bgm');

    function startMusic() {
      if (!audio) return;
      audio.volume = 0.5;
      audio.play().catch(() => {
        document.addEventListener('click', () => audio.play().catch(() => {}), { once: true });
      });
    }

    window.addEventListener('load', startMusic);
    document.addEventListener('pointerdown', startMusic, { once: true });
  </script>
</body>
</html>
